<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mesa item editor</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main id="app">
<!--screen-->
    <section class="screen" data-template="editor-v1">
      <h1>Items</h1>
      <form id="editor">
        <label for="title">Item 42</label>
        <div class="fields">
          <input id="title" name="title" disabled autocomplete="off" spellcheck="false">
          <button id="save" type="submit" disabled>Save</button>
        </div>
        <output id="preview" for="title"><!--draft--> <!--/draft--></output>
        <p id="status" role="status">Loading item…</p>
      </form>
      <div class="lists">
        <section><h2>All items</h2><ol id="list-all"></ol></section>
        <section><h2>Open</h2><ol id="list-open"></ol></section>
        <section><h2>Marked</h2><ol id="list-marked"></ol></section>
      </div>
    </section>
<!--/screen-->
  </main>
  <script type="module" src="/planned.js"></script>
</body>
</html>
